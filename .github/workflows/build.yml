name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # IntelliJ distributions are large: each IDE used for building or verifying takes several GB.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Test, verify and build
        run: |
          set -o pipefail
          mkdir -p build
          ./gradlew test verifyPlugin buildPlugin --continue 2>&1 | tee build/gradle.log

      - name: Explain the failure
        if: failure()
        run: python3 .github/scripts/report_failures.py

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: nunjucks-intellij
          path: build/distributions/*.zip

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            build/reports/
            build/test-results/
