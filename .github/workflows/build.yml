name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # IntelliJ distributions are large: each IDE used for building or verifying takes several GB.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Test, verify and build
        run: ./gradlew test verifyPlugin buildPlugin

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: nunjucks-intellij
          path: build/distributions/*.zip

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/reports/
            build/test-results/
