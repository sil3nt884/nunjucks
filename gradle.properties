pluginVersion=0.1.3

# IDE builds the plugin declares support for (plugin.xml since-build/until-build).
pluginSinceBuild=262
pluginUntilBuild=262.*
# IDE to compile and test against when localIdePath is not available (e.g. on CI).
platformVersion=2026.2.4
# IDEs the Plugin Verifier checks: the oldest supported release first, the newest last.
verifyIdeVersions=2026.2,2026.2.4
# The three lines above are updated by .github/workflows/platform-update.yml.

# Path to a local IntelliJ installation used for compilation and runIde. Ignored when it doesn't exist.
localIdePath=C:/Program Files/JetBrains/IntelliJ IDEA 2026.2
org.gradle.jvmargs=-Xmx2g
org.gradle.configuration-cache=false
kotlin.stdlib.default.dependency=false
# Lets Gradle use the IDE's bundled JetBrains Runtime as the Java 25 toolchain.
org.gradle.java.installations.paths=C:/Program Files/JetBrains/IntelliJ IDEA 2026.2/jbr
